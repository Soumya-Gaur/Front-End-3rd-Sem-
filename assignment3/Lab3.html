
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab Assignment 3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>JavaScript Lab Assignment - 3</h1>

    <!-- 1. BMI Calculator -->
    <div class="box">
        <h2>1. BMI Calculator</h2>

        <label>Weight (kg):</label>
        <input type="number" id="weight" placeholder="Enter weight">

        <label>Height (cm):</label>
        <input type="number" id="height" placeholder="Enter height">

        <button onclick="calculateBMI()">Calculate BMI</button>

        <p id="bmiResult" class="result"></p>
    </div>

    <!-- 2. Signup Form -->
    <div class="box">
        <h2>2. Signup Form with Validation</h2>

        <form id="signupForm">

            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter name">
            <p class="error" id="nameError"></p>

            <label>Email:</label>
            <input type="text" id="email" placeholder="Enter email">
            <p class="error" id="emailError"></p>

            <label>Password:</label>
            <input type="password" id="password" placeholder="Enter password">
            <p class="error" id="passwordError"></p>

            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
            <p class="error" id="confirmError"></p>

            <button type="submit">Sign Up</button>

            <p id="signupResult" class="result"></p>

        </form>
    </div>

    <!-- 3. Change Theme -->
    <div class="box">
        <h2>3. Change Color Theme</h2>

        <button onclick="changeTheme('light')">Light Theme</button>
        <button onclick="changeTheme('dark')">Dark Theme</button>
    </div>

    <!-- 4. Digital Clock -->
    <div class="box">
        <h2>4. Digital Clock</h2>

        <div id="clock" class="clock"></div>
    </div>

    <!-- 5. To-Do List -->
    <div class="box">
        <h2>5. To-Do List</h2>

        <input type="text" id="taskInput" placeholder="Enter a task">

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>
    </div>

</div>

<script>

// 1. BMI Calculator

function calculateBMI() {

    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    let result = document.getElementById("bmiResult");

    if (isNaN(weight) || isNaN(height) || weight <= 0 || height <= 0) {
        result.innerHTML = "Please enter valid weight and height.";
        return;
    }

    height = height / 100;

    let bmi = weight / (height * height);

    let category;

    if (bmi < 18.5) {
        category = "Underweight";
    }
    else if (bmi < 25) {
        category = "Normal";
    }
    else {
        category = "Overweight";
    }

    result.innerHTML = "Your BMI is " + bmi.toFixed(2) +
        "<br>Category: " + category;
}


// 2. Signup Form Validation

document.getElementById("signupForm").addEventListener("submit", function(event) {

    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    let valid = true;

    document.querySelectorAll(".error").forEach(function(element) {
        element.innerHTML = "";
    });

    document.getElementById("signupResult").innerHTML = "";

    if (name.length < 2) {
        document.getElementById("nameError").innerHTML = "Enter a valid name.";
        valid = false;
    }

    if (!email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
        document.getElementById("emailError").innerHTML = "Enter a valid email.";
        valid = false;
    }

    if (password.length < 8) {
        document.getElementById("passwordError").innerHTML =
            "Password must have at least 8 characters.";
        valid = false;
    }

    if (password !== confirmPassword || confirmPassword === "") {
        document.getElementById("confirmError").innerHTML =
            "Passwords do not match.";
        valid = false;
    }

    if (valid) {
        document.getElementById("signupResult").innerHTML =
            "Signup Successful!";

        this.reset();
    }

});


// 3. Change Color Theme

function changeTheme(theme) {

    if (theme === "dark") {
        document.body.classList.add("dark");
    }
    else {
        document.body.classList.remove("dark");
    }

}


// 4. Digital Clock

function digitalClock() {

    let date = new Date();

    let time = date.toLocaleTimeString();

    document.getElementById("clock").innerHTML = time;

}

setInterval(digitalClock, 1000);

digitalClock();


// 5. To-Do List

function addTask() {

    let input = document.getElementById("taskInput");

    let task = input.value.trim();

    if (task === "") {
        alert("Please enter a task!");
        return;
    }

    let li = document.createElement("li");

    let checkbox = document.createElement("input");
    checkbox.type = "checkbox";

    let span = document.createElement("span");
    span.textContent = task;

    checkbox.onclick = function() {
        span.classList.toggle("completed");
    };

    let deleteButton = document.createElement("button");
    deleteButton.innerHTML = "Delete";

    deleteButton.onclick = function() {
        li.remove();
    };

    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(deleteButton);

    document.getElementById("taskList").appendChild(li);

    input.value = "";

}

</script>

</body>
</html>
